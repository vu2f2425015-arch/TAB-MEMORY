<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Memory</title>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_aW1tdW5lLWNob3ctMzcuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://immune-chow-37.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0a0c0f;
      --bg2:       #0e1117;
      --bg3:       #141820;
      --border:    #1e2535;
      --border2:   #2a3347;
      --green:     #00ff88;
      --green-dim: rgba(0,255,136,0.08);
      --amber:     #ffaa00;
      --amber-dim: rgba(255,170,0,0.12);
      --red:       #ff4060;
      --red-dim:   rgba(255,64,96,0.12);
      --blue:      #4da6ff;
      --purple:    #a78bfa;
      --text:      #e2e8f0;
      --text2:     #8892a4;
      --text3:     #4a5568;
      --mono:      'JetBrains Mono', monospace;
      --display:   'Syne', sans-serif;
      --r:         6px;
      --r2:        10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,12,15,0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; gap: 20px;
    }
    .logo {
      font-family: var(--display); font-size: 17px; font-weight: 800;
      letter-spacing: -0.5px; color: var(--text);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .logo-dot {
      width: 8px; height: 8px; background: var(--green);
      border-radius: 50%; box-shadow: 0 0 10px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; box-shadow: 0 0 10px var(--green); }
      50%      { opacity:0.5; box-shadow: 0 0 4px var(--green); }
    }
    .header-stats { display: flex; gap: 12px; margin-left: 8px; }
    .stat-chip {
      font-size: 11px; color: var(--text3); padding: 3px 10px;
      border: 1px solid var(--border); border-radius: 20px;
      background: var(--bg2); white-space: nowrap;
    }
    .stat-chip span { color: var(--green); font-weight: 600; }
    .search-wrap { position: relative; flex: 1; max-width: 380px; margin-left: auto; }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); color: var(--text3); pointer-events: none;
    }
    #search {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 7px 12px 7px 36px;
      color: var(--text); font-family: var(--mono); font-size: 12px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search::placeholder { color: var(--text3); }
    #search:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
    .kbd {
      font-size: 10px; color: var(--text3); background: var(--bg3);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 6px; font-family: var(--mono); flex-shrink: 0;
    }

    /* ── LAYOUT ── */
    .app {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 210px 1fr;
      min-height: calc(100vh - 56px);
    }

    /* ── SIDEBAR ── */
    aside {
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex; flex-direction: column; gap: 4px;
      position: sticky; top: 56px;
      height: calc(100vh - 56px); overflow-y: auto;
    }
    .sidebar-label {
      font-size: 10px; color: var(--text3);
      text-transform: uppercase; letter-spacing: 1.5px;
      padding: 8px 8px 4px; font-weight: 600;
    }
    .filter-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 9px; border-radius: var(--r);
      cursor: pointer; color: var(--text2); font-size: 12px;
      font-family: var(--mono); background: none; border: none;
      width: 100%; text-align: left; transition: all 0.15s;
    }
    .filter-btn:hover { background: var(--bg3); color: var(--text); }
    .filter-btn.active {
      background: var(--green-dim); color: var(--green);
      border: 1px solid rgba(0,255,136,0.18);
    }
    .filter-btn .count {
      margin-left: auto; font-size: 10px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; padding: 1px 6px; color: var(--text3);
    }
    .filter-btn.active .count {
      background: var(--green-dim); border-color: rgba(0,255,136,0.3); color: var(--green);
    }
    .fi { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sidebar-divider { height: 1px; background: var(--border); margin: 6px 0; }
    .tag-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
    .tag-dot.research { background: #4da6ff; }
    .tag-dot.read     { background: #a78bfa; }
    .tag-dot.buy      { background: #ffaa00; }
    .tag-dot.task     { background: #ff4060; }
    .tag-dot.ref      { background: #00ff88; }
    .sort-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px; margin-top: auto;
    }
    .sort-label { font-size: 11px; color: var(--text3); flex-shrink: 0; }
    select {
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--text2); font-family: var(--mono); font-size: 11px;
      padding: 4px 8px; border-radius: var(--r); cursor: pointer; outline: none; flex: 1;
    }
    select:focus { border-color: var(--green); }

    /* ── MAIN ── */
    main { padding: 24px; overflow-y: auto; }
    .main-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .view-title { font-family: var(--display); font-size: 20px; font-weight: 700; }
    .view-count {
      font-size: 12px; color: var(--text3); background: var(--bg2);
      border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px;
    }
    .view-toggle {
      margin-left: auto; display: flex;
      border: 1px solid var(--border); border-radius: var(--r); overflow: hidden;
    }
    .view-btn {
      background: none; border: none; padding: 6px 10px;
      cursor: pointer; color: var(--text3); transition: all 0.15s;
    }
    .view-btn:hover { background: var(--bg3); color: var(--text2); }
    .view-btn.active { background: var(--bg3); color: var(--green); }

    /* ── CARDS ── */
    #tabs-container { display: flex; flex-direction: column; gap: 8px; }
    #tabs-container.grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(340px,1fr)); gap: 12px; }
    .tab-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--r2); padding: 14px 16px;
      display: flex; align-items: flex-start; gap: 14px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      position: relative; overflow: hidden;
      animation: slideIn 0.22s ease both;
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .tab-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; border-radius: 3px 0 0 3px;
    }
    .tab-card[data-tag="research"]::before { background: #4da6ff; }
    .tab-card[data-tag="read"]::before     { background: #a78bfa; }
    .tab-card[data-tag="buy"]::before      { background: #ffaa00; }
    .tab-card[data-tag="task"]::before     { background: #ff4060; }
    .tab-card[data-tag="ref"]::before      { background: #00ff88; }
    .tab-card:hover { border-color: var(--border2); box-shadow: 0 4px 20px rgba(0,0,0,0.3); transform: translateY(-1px); }
    .tab-card.fading { border-color: rgba(255,170,0,0.25); background: linear-gradient(135deg,var(--bg2),rgba(255,170,0,0.03)); }
    .tab-card.snoozed { opacity: 0.55; }

    .favicon-wrap {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--border); overflow: hidden; flex-shrink: 0;
      background: var(--bg3); display: flex; align-items: center;
      justify-content: center; margin-top: 2px;
    }
    .favicon-wrap img { width: 20px; height: 20px; object-fit: contain; }
    .fav-fb { font-size: 13px; color: var(--text3); }

    .tab-body { flex: 1; min-width: 0; }
    .tab-title {
      font-family: var(--display); font-size: 14px; font-weight: 600;
      color: var(--text); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; margin-bottom: 3px;
    }
    .tab-url {
      font-size: 11px; color: var(--text3); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; margin-bottom: 7px;
    }
    .tab-url a { color: inherit; text-decoration: none; }
    .tab-url a:hover { color: var(--blue); text-decoration: underline; }
    .tab-reason {
      font-size: 12px; color: var(--text2); background: var(--bg3);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 9px; margin-bottom: 8px; line-height: 1.5;
      display: flex; gap: 6px;
    }
    .ri { color: var(--text3); flex-shrink: 0; }
    .tab-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .tag-badge {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; padding: 2px 7px; border-radius: 4px;
    }
    .tag-badge.research { background: rgba(77,166,255,0.15); color: #4da6ff; }
    .tag-badge.read     { background: rgba(167,139,250,0.15); color: #a78bfa; }
    .tag-badge.buy      { background: rgba(255,170,0,0.15); color: #ffaa00; }
    .tag-badge.task     { background: rgba(255,64,96,0.15); color: #ff4060; }
    .tag-badge.ref      { background: rgba(0,255,136,0.10); color: #00ff88; }
    .time-badge { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 3px; }
    .fading-badge {
      font-size: 10px; color: var(--amber); background: var(--amber-dim);
      border: 1px solid rgba(255,170,0,0.25); border-radius: 4px; padding: 2px 7px;
    }
    .snooze-badge {
      font-size: 10px; color: var(--purple); background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.25); border-radius: 4px; padding: 2px 7px;
    }
    .reminder-badge {
      font-size: 10px; color: var(--purple); background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.25); border-radius: 4px; padding: 2px 7px;
    }
    .fade-bar-wrap { height: 2px; background: var(--border); border-radius: 1px; margin-top: 7px; }
    .fade-bar { height: 100%; border-radius: 1px; background: linear-gradient(90deg,var(--amber),var(--red)); }

    /* ── ACTIONS ── */
    .tab-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .ab {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid var(--border); background: none; color: var(--text3);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; position: relative;
    }
    .ab:hover                { border-color: var(--border2); color: var(--text); background: var(--bg3); }
    .ab.del:hover            { border-color: var(--red); color: var(--red); background: var(--red-dim); }
    .ab.arc:hover            { border-color: var(--green); color: var(--green); background: var(--green-dim); }
    .ab.snz:hover            { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
    [data-tip]::after {
      content: attr(data-tip); position: absolute; right: calc(100% + 8px); top: 50%;
      transform: translateY(-50%); background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 5px; padding: 4px 8px; font-size: 11px; white-space: nowrap;
      color: var(--text2); pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 99;
    }
    [data-tip]:hover::after { opacity: 1; }

    /* ── EMPTY ── */
    .empty {
      text-align: center; padding: 80px 20px; color: var(--text3);
    }
    .empty svg { margin: 0 auto 16px; opacity: 0.25; display: block; }
    .empty h3 { font-family: var(--display); font-size: 18px; color: var(--text2); margin-bottom: 6px; }
    .empty p { font-size: 12px; line-height: 1.6; }

    /* ── ARCHIVED ── */
    .arch-toggle {
      display: flex; align-items: center; gap: 8px; padding: 10px 0;
      cursor: pointer; color: var(--text3); font-size: 12px; font-weight: 600;
      user-select: none; margin-top: 8px;
    }
    .arch-toggle:hover { color: var(--text2); }
    .arch-section { display: none; flex-direction: column; gap: 8px; }
    .arch-section.open { display: flex; }

    /* ── FAB ── */
    #add-btn {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--green); color: #000; border: none;
      border-radius: 14px; padding: 0 22px; height: 46px;
      font-family: var(--display); font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      animation: fabPulse 2.5s ease-in-out infinite;
      transition: transform 0.15s, box-shadow 0.15s; z-index: 90;
    }
    #add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,255,136,0.4); animation: none; }
    @keyframes fabPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); } 50% { box-shadow: 0 0 0 8px rgba(0,255,136,0); } }

    /* ── MODAL ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: 14px; width: 520px; max-width: calc(100vw - 32px);
      padding: 28px; transform: translateY(10px) scale(0.97);
      transition: transform 0.2s; box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }
    .overlay.open .modal { transform: translateY(0) scale(1); }
    .modal-hdr {
      display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
    }
    .modal-title { font-family: var(--display); font-size: 18px; font-weight: 700; }
    .modal-x {
      margin-left: auto; background: none; border: none; color: var(--text3);
      cursor: pointer; padding: 4px; border-radius: 6px; transition: all 0.15s;
    }
    .modal-x:hover { background: var(--bg3); color: var(--text); }
    .fg { margin-bottom: 16px; }
    .fl {
      display: block; font-size: 11px; color: var(--text3);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600;
    }
    .fi-input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--r); padding: 9px 12px; color: var(--text);
      font-family: var(--mono); font-size: 12px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fi-input::placeholder { color: var(--text3); }
    .fi-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
    textarea.fi-input { resize: vertical; min-height: 70px; line-height: 1.6; }
    .tag-picker { display: flex; gap: 7px; flex-wrap: wrap; }
    .tag-opt {
      padding: 5px 11px; border-radius: 5px; border: 1px solid var(--border);
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
      cursor: pointer; transition: all 0.15s; font-family: var(--mono);
      background: var(--bg3); color: var(--text3);
    }
    .tag-opt:hover { border-color: var(--border2); color: var(--text2); }
    .tag-opt.sel.research { background: rgba(77,166,255,0.15); border-color: #4da6ff; color: #4da6ff; }
    .tag-opt.sel.read     { background: rgba(167,139,250,0.15); border-color: #a78bfa; color: #a78bfa; }
    .tag-opt.sel.buy      { background: rgba(255,170,0,0.15); border-color: #ffaa00; color: #ffaa00; }
    .tag-opt.sel.task     { background: rgba(255,64,96,0.15); border-color: #ff4060; color: #ff4060; }
    .tag-opt.sel.ref      { background: rgba(0,255,136,0.10); border-color: #00ff88; color: #00ff88; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-ftr { display: flex; gap: 10px; margin-top: 22px; }
    .btn-p {
      flex: 1; background: var(--green); color: #000; border: none;
      border-radius: var(--r); padding: 10px 20px;
      font-family: var(--display); font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-p:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-s {
      background: none; border: 1px solid var(--border); color: var(--text2);
      border-radius: var(--r); padding: 10px 16px;
      font-family: var(--mono); font-size: 12px; cursor: pointer; transition: all 0.15s;
    }
    .btn-s:hover { border-color: var(--border2); background: var(--bg3); }

    /* ── SNOOZE MODAL ── */
    .snooze-opt {
      display: block; width: 100%; padding: 10px 14px; margin-bottom: 6px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r);
      text-align: left; color: var(--text2); font-family: var(--mono);
      font-size: 12px; cursor: pointer; transition: all 0.12s;
    }
    .snooze-opt:hover { background: var(--amber-dim); border-color: rgba(255,170,0,0.3); color: var(--amber); }

    /* ── TOAST ── */
    #toast-wrap {
      position: fixed; bottom: 84px; right: 28px; z-index: 300;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: var(--r); padding: 10px 16px; font-size: 12px;
      color: var(--text); box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: toastIn 0.25s ease both, toastOut 0.25s ease 2.5s both;
      display: flex; align-items: center; gap: 8px;
    }
    .toast.ok  { border-color: rgba(0,255,136,0.3); }
    .toast.ok::before  { content:'✓'; color: var(--green); font-weight: 700; }
    .toast.err::before { content:'✕'; color: var(--red); font-weight: 700; }
    @keyframes toastIn  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── AUTH OVERLAY ── */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
    }
    #auth-overlay.hidden { display: none; }
    #clerk-sign-in { width: 100%; max-width: 420px; }
    .auth-logo {
      font-family: var(--display); font-size: 26px; font-weight: 800;
      letter-spacing: -0.5px; color: var(--text);
      display: flex; align-items: center; gap: 10px;
    }
    .auth-logo-dot {
      width: 10px; height: 10px; background: var(--green);
      border-radius: 50%; box-shadow: 0 0 12px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    .auth-tagline {
      font-size: 12px; color: var(--text2); text-align: center;
      max-width: 300px; line-height: 1.6;
    }

    /* user button in header */
    #clerk-user-btn { margin-left: 12px; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo"><div class="logo-dot"></div>Tab Memory</div>
  <div class="header-stats">
    <div class="stat-chip"><span id="s-total">0</span> active</div>
    <div class="stat-chip"><span id="s-fading">0</span> fading</div>
    <div class="stat-chip"><span id="s-snoozed">0</span> snoozed</div>
  </div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="text" placeholder="Search tabs, reasons, URLs…" />
  </div>
  <span class="kbd">⌘K</span>
  <div id="clerk-user-btn"></div>
</header>

<!-- APP -->
<div class="app">
  <aside>
    <div class="sidebar-label">Views</div>
    <button class="filter-btn active" data-f="active">
      <span class="fi"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
      All Active <span class="count" id="c-active">0</span>
    </button>
    <button class="filter-btn" data-f="fading">
      <span class="fi"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
      Fading <span class="count" id="c-fading">0</span>
    </button>
    <button class="filter-btn" data-f="snoozed">
      <span class="fi"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></span>
      Snoozed <span class="count" id="c-snoozed">0</span>
    </button>

    <div class="sidebar-divider"></div>
    <div class="sidebar-label">Tags</div>
    <button class="filter-btn" data-f="tag:research"><span class="tag-dot research"></span>Research<span class="count" id="c-research">0</span></button>
    <button class="filter-btn" data-f="tag:read"><span class="tag-dot read"></span>Read Later<span class="count" id="c-read">0</span></button>
    <button class="filter-btn" data-f="tag:buy"><span class="tag-dot buy"></span>To Buy<span class="count" id="c-buy">0</span></button>
    <button class="filter-btn" data-f="tag:task"><span class="tag-dot task"></span>Task<span class="count" id="c-task">0</span></button>
    <button class="filter-btn" data-f="tag:ref"><span class="tag-dot ref"></span>Reference<span class="count" id="c-ref">0</span></button>

    <div class="sidebar-divider"></div>
    <div class="sort-row">
      <span class="sort-label">Sort</span>
      <select id="sort-sel">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="fading">Fading first</option>
        <option value="az">A → Z</option>
      </select>
    </div>
  </aside>

  <main>
    <div class="main-header">
      <h1 class="view-title" id="view-title">All Active</h1>
      <span class="view-count" id="view-count">0 tabs</span>
      <div class="view-toggle">
        <button class="view-btn active" id="btn-list" title="List">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
        <button class="view-btn" id="btn-grid" title="Grid">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="tabs-container"></div>

    <div class="arch-toggle" id="arch-toggle" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      <span id="arch-label">Show archived (0)</span>
    </div>
    <div class="arch-section" id="arch-section"></div>
  </main>
</div>

<!-- FAB -->
<button id="add-btn">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
  Save Tab
</button>

<div id="toast-wrap"></div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="add-modal">
  <div class="modal">
    <div class="modal-hdr">
      <div class="logo-dot" style="width:6px;height:6px;flex-shrink:0"></div>
      <span class="modal-title" id="m-title">Save Tab</span>
      <button class="modal-x" id="m-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="fg"><label class="fl">URL</label><input id="f-url" class="fi-input" type="url" placeholder="https://…" /></div>
    <div class="fg"><label class="fl">Title <span style="color:var(--text3);font-size:10px;text-transform:none;letter-spacing:0">(optional)</span></label><input id="f-title" class="fi-input" type="text" placeholder="Leave blank to use URL" /></div>
    <div class="fg"><label class="fl">Why are you saving this?</label><textarea id="f-reason" class="fi-input" placeholder="Be specific — future you will thank you"></textarea></div>
    <div class="fg">
      <label class="fl">Tag</label>
      <div class="tag-picker" id="tag-picker">
        <button class="tag-opt ref sel" data-tag="ref">Ref</button>
        <button class="tag-opt research" data-tag="research">Research</button>
        <button class="tag-opt read" data-tag="read">Read</button>
        <button class="tag-opt buy" data-tag="buy">Buy</button>
        <button class="tag-opt task" data-tag="task">Task</button>
      </div>
    </div>
    <div class="form-row">
      <div class="fg"><label class="fl">Reminder date</label><input id="f-reminder" class="fi-input" type="date" /></div>
      <div class="fg"><label class="fl">Priority</label>
        <select id="f-priority" class="fi-input">
          <option value="">None</option>
          <option value="high">🔴 High</option>
          <option value="med">🟡 Medium</option>
          <option value="low">🔵 Low</option>
        </select>
      </div>
    </div>
    <div class="modal-ftr">
      <button class="btn-s" id="m-cancel">Cancel</button>
      <button class="btn-p" id="m-save">Save Tab</button>

<!-- SNOOZE MODAL -->
<div class="overlay" id="snooze-modal">
  <div class="modal" style="width:300px">
    <div class="modal-hdr">
      <span class="modal-title">Snooze Tab</span>
      <button class="modal-x" onclick="closeM('snooze-modal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">Resurface this tab after…</p>
    <div id="snooze-opts">
      <button class="snooze-opt" data-days="1">Tomorrow</button>
      <button class="snooze-opt" data-days="3">In 3 days</button>
      <button class="snooze-opt" data-days="7">Next week</button>
      <button class="snooze-opt" data-days="14">In 2 weeks</button>
    </div>
  </div>
</div>

<script>
  // ── CLERK AUTH INIT ──
  window.addEventListener('load', async () => {
    await window.Clerk.load();

    const overlay = document.getElementById('auth-overlay');

    if (!window.Clerk.user) {
      // Show sign-in overlay
      overlay.classList.remove('hidden');
      window.Clerk.mountSignIn(document.getElementById('clerk-sign-in'));
    } else {
      overlay.classList.add('hidden');
      window.Clerk.mountUserButton(document.getElementById('clerk-user-btn'));
      await initApp();
    }

    // Listen for auth state changes (sign-in / sign-out)
    window.Clerk.addListener(({ user }) => {
      if (user) {
        overlay.classList.add('hidden');
        window.Clerk.mountUserButton(document.getElementById('clerk-user-btn'));
        initApp();
      } else {
        overlay.classList.remove('hidden');
        tabs = [];
        render();
      }
    });
  });

  // ── STATE ──
  let tabs = [], filter = 'active', sort = 'newest', view = 'list';
  let editId = null, snoozeId = null, selTag = 'ref';

  // ── AUTH FETCH HELPER ──
  async function authFetch(url, opts = {}) {
    const token = await window.Clerk.session.getToken();
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}), Authorization: `Bearer ${token}` };
    return fetch(url, { ...opts, headers });
  }

  // ── API ──
  const api = {
    list:   ()      => authFetch('/api/tabs').then(r=>r.json()),
    add:    b       => authFetch('/api/tabs',{method:'POST',body:JSON.stringify(b)}).then(r=>r.json()),
    patch:  (id,b)  => authFetch(`/api/tabs/${id}`,{method:'PATCH',body:JSON.stringify(b)}).then(r=>r.json()),
    del:    id      => authFetch(`/api/tabs/${id}`,{method:'DELETE'}).then(r=>r.json()),
  };

  // ── INIT APP (called after auth) ──
  async function initApp() {
    tabs = await api.list();
    render();
    setupListeners();
  }

  // ── UTILS ──
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const age = iso => Math.floor((Date.now()-new Date(iso))/86400000);
  const host = url => { try{return new URL(url).hostname.replace('www.','')}catch{return url} };
  const fav  = url => { try{return`https://www.google.com/s2/favicons?sz=32&domain=${new URL(url).hostname}`}catch{return null} };
  const rel  = iso => { const d=age(iso); if(d===0)return'today';if(d===1)return'1d ago';if(d<7)return`${d}d ago`;if(d<30)return`${Math.floor(d/7)}w ago`;return`${Math.floor(d/30)}mo ago`; };
  const tagL = t => ({research:'Research',read:'Read',buy:'Buy',task:'Task',ref:'Ref'}[t]||t);
  const prL  = {high:'🔴',med:'🟡',low:'🔵'};

  function toast(msg, type='ok') {
    const el = document.createElement('div');
    el.className = `toast ${type}`; el.textContent = msg;
    document.getElementById('toast-wrap').appendChild(el);
    setTimeout(()=>el.remove(), 2800);
  }
  const openM  = id => document.getElementById(id).classList.add('open');
  const closeM = id => document.getElementById(id).classList.remove('open');

  // ── FILTER ──
  function filtered() {
    const q = document.getElementById('search').value.toLowerCase();
    let list = tabs.filter(t => !q || `${t.title} ${t.url} ${t.reason} ${t.tag}`.toLowerCase().includes(q));
    if (filter==='active')           list = list.filter(t=>!t.archived&&(!t.snoozedUntil||new Date(t.snoozedUntil)<=new Date()));
    if (filter==='fading')           list = list.filter(t=>!t.archived&&age(t.savedAt)>=14);
    if (filter==='snoozed')          list = list.filter(t=>!t.archived&&t.snoozedUntil&&new Date(t.snoozedUntil)>new Date());
    if (filter.startsWith('tag:'))   list = list.filter(t=>!t.archived&&t.tag===filter.split(':')[1]);
    if (sort==='newest') list.sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));
    if (sort==='oldest') list.sort((a,b)=>new Date(a.savedAt)-new Date(b.savedAt));
    if (sort==='fading') list.sort((a,b)=>new Date(a.savedAt)-new Date(b.savedAt));
    if (sort==='az')     list.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
    return list;
  }

  // ── RENDER ──
  function counts() {
    const active  = tabs.filter(t=>!t.archived&&(!t.snoozedUntil||new Date(t.snoozedUntil)<=new Date()));
    const fading  = tabs.filter(t=>!t.archived&&age(t.savedAt)>=14);
    const snoozed = tabs.filter(t=>!t.archived&&t.snoozedUntil&&new Date(t.snoozedUntil)>new Date());
    document.getElementById('s-total').textContent   = active.length;
    document.getElementById('s-fading').textContent  = fading.length;
    document.getElementById('s-snoozed').textContent = snoozed.length;
    document.getElementById('c-active').textContent  = active.length;
    document.getElementById('c-fading').textContent  = fading.length;
    document.getElementById('c-snoozed').textContent = snoozed.length;
    ['research','read','buy','task','ref'].forEach(tag=>{
      document.getElementById(`c-${tag}`).textContent = tabs.filter(t=>!t.archived&&t.tag===tag).length;
    });
  }

  function render() {
    counts();
    const list = filtered();
    const archived = tabs.filter(t=>t.archived);
    const titles = {active:'All Active',fading:'Fading Tabs',snoozed:'Snoozed','tag:research':'Research','tag:read':'Read Later','tag:buy':'To Buy','tag:task':'Tasks','tag:ref':'Reference'};
    document.getElementById('view-title').textContent = titles[filter]||'All';
    document.getElementById('view-count').textContent = `${list.length} tab${list.length!==1?'s':''}`;

    const c = document.getElementById('tabs-container');
    view==='grid' ? c.classList.add('grid') : c.classList.remove('grid');
    c.innerHTML = '';
    if (!list.length) {
      c.innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><h3>Nothing here</h3><p>Hit ⌘K or the button to save a tab.</p></div>`;
    }
    list.forEach((t,i) => { const el = card(t); el.style.animationDelay=`${i*25}ms`; c.appendChild(el); });

    // archived
    const as = document.getElementById('arch-section');
    const at = document.getElementById('arch-toggle');
    if (archived.length) {
      at.style.display='flex';
      document.getElementById('arch-label').textContent = (as.classList.contains('open')?'Hide':'Show')+` archived (${archived.length})`;
      if (as.classList.contains('open')) { as.innerHTML=''; archived.forEach(t=>as.appendChild(card(t,true))); }
    } else { at.style.display='none'; }
  }

  function card(t, isArch=false) {
    const el = document.createElement('div');
    const a = age(t.savedAt);
    el.className = 'tab-card'+(a>=14&&!isArch?' fading':'')+(t.snoozedUntil&&new Date(t.snoozedUntil)>new Date()?' snoozed':'');
    el.dataset.tag = t.tag;
    const f = fav(t.url);
    const fp = Math.min(100,Math.round(a/30*100));
    el.innerHTML = `
      <div class="favicon-wrap">${f?`<img src="${f}" alt="" onerror="this.parentElement.innerHTML='<span class=\\'fav-fb\\'>⬡</span>'">`:'<span class="fav-fb">⬡</span>'}</div>
      <div class="tab-body">
        <div class="tab-title">${esc(t.title||host(t.url))}</div>
        <div class="tab-url"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(host(t.url))}</a></div>
        ${t.reason?`<div class="tab-reason"><span class="ri">»</span><span>${esc(t.reason)}</span></div>`:''}
        <div class="tab-meta">
          <span class="tag-badge ${t.tag}">${tagL(t.tag)}</span>
          ${t.priority?`<span style="font-size:11px">${prL[t.priority]}</span>`:''}
          <span class="time-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${rel(t.savedAt)}</span>
          ${a>=14&&!isArch?`<span class="fading-badge">⚡ ${a}d old</span>`:''}
          ${t.reminder?`<span class="reminder-badge">🔔 ${t.reminder}</span>`:''}
          ${t.snoozedUntil&&new Date(t.snoozedUntil)>new Date()?`<span class="snooze-badge">💤 ${new Date(t.snoozedUntil).toLocaleDateString()}</span>`:''}
        </div>
        ${a>=14&&!isArch?`<div class="fade-bar-wrap"><div class="fade-bar" style="width:${fp}%"></div></div>`:''}
      </div>
      <div class="tab-actions">
        <button class="ab" data-tip="Open" onclick="window.open('${esc(t.url)}','_blank')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>
        <button class="ab" data-tip="Edit" onclick="editTab('${t.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        ${!isArch?`<button class="ab snz" data-tip="Snooze" onclick="startSnooze('${t.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 17 9 13 13 17 17 13"/><line x1="9" y1="13" x2="9" y2="6"/><line x1="17" y1="13" x2="17" y2="6"/></svg></button>`:''}
        <button class="ab arc" data-tip="${isArch?'Unarchive':'Archive'}" onclick="doArchive('${t.id}',${!t.archived})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg></button>
        <button class="ab del" data-tip="Delete" onclick="doDelete('${t.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
      </div>`;
    return el;
  }

  // ── ACTIONS ──
  async function doDelete(id) {
    if (!confirm('Delete this tab?')) return;
    await api.del(id); tabs=tabs.filter(t=>t.id!==id); render(); toast('Deleted');
  }
  async function doArchive(id, arch) {
    const u = await api.patch(id,{archived:arch}); tabs=tabs.map(t=>t.id===id?u:t); render(); toast(arch?'Archived':'Unarchived');
  }
  function startSnooze(id) { snoozeId=id; openM('snooze-modal'); }

  function editTab(id) {
    const t=tabs.find(x=>x.id===id); if(!t) return;
    editId=id;
    document.getElementById('f-url').value=t.url||'';
    document.getElementById('f-title').value=t.title||'';
    document.getElementById('f-reason').value=t.reason||'';
    document.getElementById('f-reminder').value=t.reminder||'';
    document.getElementById('f-priority').value=t.priority||'';
    setTag(t.tag||'ref');
    document.getElementById('m-title').textContent='Edit Tab';
    document.getElementById('m-save').textContent='Update Tab';
    openM('add-modal');
  }

  // ── TAG PICKER ──
  function setTag(tag) {
    selTag=tag;
    document.querySelectorAll('.tag-opt').forEach(b=>b.classList.toggle('sel',b.dataset.tag===tag));
  }
  // ── MODAL ──
  function openAdd() {
    editId=null;
    ['f-url','f-title','f-reason','f-reminder'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-priority').value='';
    setTag('ref');
    document.getElementById('m-title').textContent='Save Tab';
    document.getElementById('m-save').textContent='Save Tab';
    openM('add-modal');
    setTimeout(()=>document.getElementById('f-url').focus(),100);
  }
  document.getElementById('add-btn').onclick = openAdd;
  document.getElementById('m-cancel').onclick = ()=>closeM('add-modal');
  document.getElementById('m-close').onclick  = ()=>closeM('add-modal');
  document.getElementById('add-modal').addEventListener('click',e=>{ if(e.target===document.getElementById('add-modal')) closeM('add-modal'); });
  document.getElementById('snooze-modal').addEventListener('click',e=>{ if(e.target===document.getElementById('snooze-modal')) closeM('snooze-modal'); });

  document.getElementById('m-save').addEventListener('click', async ()=>{
    const url=document.getElementById('f-url').value.trim();
    if(!url){document.getElementById('f-url').focus();return;}
    const body={
      url, title:document.getElementById('f-title').value.trim()||url,
      reason:document.getElementById('f-reason').value.trim(),
      tag:selTag, reminder:document.getElementById('f-reminder').value||null,
      priority:document.getElementById('f-priority').value||null
    };
    if(editId){
      const u=await api.patch(editId,body); tabs=tabs.map(t=>t.id===editId?u:t); toast('Updated');
    } else {
      const created=await api.add(body); tabs.unshift(created); toast('Saved!');
    }
    closeM('add-modal'); render();
  });

  // ── FILTERS / SORT / VIEW ──
  function setupListeners() {
  document.getElementById('snooze-opts').addEventListener('click', async e=>{
    const btn=e.target.closest('[data-days]'); if(!btn||!snoozeId) return;
    const days=parseInt(btn.dataset.days);
    const until=new Date(Date.now()+days*86400000).toISOString();
    const u=await api.patch(snoozeId,{snoozedUntil:until}); tabs=tabs.map(t=>t.id===snoozeId?u:t);
    snoozeId=null; closeM('snooze-modal'); render(); toast(`Snoozed ${days}d`);
  });
  document.getElementById('tag-picker').addEventListener('click',e=>{
    const b=e.target.closest('.tag-opt'); if(b) setTag(b.dataset.tag);
  });
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); filter=btn.dataset.f; render();
    });
  });
  document.getElementById('sort-sel').addEventListener('change',e=>{sort=e.target.value;render();});
  document.getElementById('search').addEventListener('input',render);
  document.getElementById('btn-list').addEventListener('click',()=>{ view='list'; document.getElementById('btn-list').classList.add('active'); document.getElementById('btn-grid').classList.remove('active'); render(); });
  document.getElementById('btn-grid').addEventListener('click',()=>{ view='grid'; document.getElementById('btn-grid').classList.add('active'); document.getElementById('btn-list').classList.remove('active'); render(); });
  document.getElementById('arch-toggle').addEventListener('click',()=>{ document.getElementById('arch-section').classList.toggle('open'); render(); });

  // ── KEYBOARD ──
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openAdd();}
    if(e.key==='Escape'){closeM('add-modal');closeM('snooze-modal');}
    if((e.metaKey||e.ctrlKey)&&e.key==='f'){e.preventDefault();document.getElementById('search').focus();}
  });
  } // end setupListeners
</script>
